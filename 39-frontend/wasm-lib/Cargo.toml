[package]
name = "wasm-lib"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib — .wasm для браузера, rlib — чтобы гонять обычные cargo test
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "console"] }

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
wasm-bindgen-test = "0.3"
