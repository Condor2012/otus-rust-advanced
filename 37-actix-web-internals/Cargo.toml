[package]
name = "actix-internals-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-ws = "0.4"
actix-rt = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }
thiserror = "2"
log = "0.4"
bytes = "1"
env_logger = "0.11"

[dev-dependencies]
awc = "3"
